name: Quality and security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - name: Restore backend and tests
        run: dotnet restore tests/FTCERP.Tests/FTCERP.Tests.csproj --configfile NuGet.Config
      - name: Restore OpenAPI exporter
        run: dotnet restore tools/FTCERP.OpenApiExporter/FTCERP.OpenApiExporter.csproj --configfile NuGet.Config
      - name: Build backend
        run: dotnet build FTCERP.Host.csproj --no-restore -p:SkipClientBuild=true --configuration Release
      - name: Test backend
        run: dotnet test tests/FTCERP.Tests/FTCERP.Tests.csproj --no-restore -p:SkipClientBuild=true --configuration Release
      - name: Validate migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          dotnet ef migrations script --project FTCERP.Host.csproj --no-build --configuration Release --idempotent --output "$RUNNER_TEMP/migrations.sql"
          test -s "$RUNNER_TEMP/migrations.sql"
      - name: Validate version-controlled OpenAPI contract
        run: dotnet run --project tools/FTCERP.OpenApiExporter/FTCERP.OpenApiExporter.csproj --no-restore --configuration Release -- --output docs/api/openapi-v1.json --check
      - name: Validate recovery drill safety contract
        shell: pwsh
        run: |
          ./tools/Invoke-OpmsSqlServerRecoveryDrill.ps1 -ValidateOnly
          dotnet run --project tools/FTCERP.RecoveryDrill/FTCERP.RecoveryDrill.csproj --no-restore --configuration Release -- --validate-only
          dotnet run --project tools/FTCERP.PerformanceAcceptance/FTCERP.PerformanceAcceptance.csproj --no-restore --configuration Release -- --validate-only
          dotnet run --project tools/FTCERP.DataCutoverAcceptance/FTCERP.DataCutoverAcceptance.csproj --no-restore --configuration Release -- --validate-only
      - name: Audit backend dependencies
        shell: pwsh
        run: |
          $audit = dotnet list FTCERP.Host.csproj package --vulnerable --include-transitive 2>&1
          $audit | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "The backend dependency audit command failed with exit code $LASTEXITCODE."
          }
          if (($audit -join "`n") -match 'has the following vulnerable packages') {
            throw "The backend dependency audit found one or more vulnerable packages."
          }
      - name: Install frontend
        working-directory: ClientApp
        run: npm ci
      - name: Type-check frontend
        working-directory: ClientApp
        run: npm run typecheck
      - name: Lint frontend
        working-directory: ClientApp
        run: npm run lint
      - name: Test frontend
        working-directory: ClientApp
        run: npm run test:run
      - name: Test accessibility baseline
        working-directory: ClientApp
        run: npm run test:a11y
      - name: Build frontend and enforce bundle budget
        working-directory: ClientApp
        run: npm run build:verify
      - name: Audit frontend dependencies
        working-directory: ClientApp
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
